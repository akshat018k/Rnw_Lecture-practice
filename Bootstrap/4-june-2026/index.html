<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boostrap Componet</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <h4>Accordion</h4>
      <div class="accordion">
        <div class="accordion-item">
          <button class="accordion-button">What is Bootstrap?</button>
        </div>
      </div>

      <br />

      <h4>Alerts</h4>
      <div class="alert alert-success">Payment Successful</div>

      <h4>Bagde</h4>
      <span class="badge bg-danger">5</span>

      <br />

      <h4>Buttons</h4>
      <button class="btn btn-primary">Login</button>

      <br />
      <br />

      <h4>Button Group</h4>
      <div class="btn-group">
        <button>Bold</button>
        <button>Italic</button>
      </div>

      <br />
      <br />

      <h4>Card</h4>
      <div class="card">Product Details</div>

      <br />

      <h4>Carousel</h4>
      <div class="carousel">
        <img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTc9APxkj0xClmrU3PpMZglHQkx446nQPG6lA&s"
          alt=""
        />
      </div>

      <br><br>

      <h4>Close Button</h4>
      <button class="btn-close"></button>

      <br><br>

      <h4>Collapse</h4>
      <div class="collapse">
        Hidden Content
       </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
