<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Boxes</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
  </head>
  <body>
    
    <div class="container mt-5">
      <h2 class="text-center mb-4">Column Wise Responsive Box</h2>

      <div class="row">
        <div class="col-12 col-md-6 mb-3">
          <div class="bg-primary text-white p-5 text-center rounded">
            <h4>Box 1</h4>
            <p>Responsive Bootstrap Box</p>
          </div>
        </div>

        <div class="col-12 col-md-6 mb-3">
          <div class="bg-success text-white p-5 text-center rounded">
            <h4>Box 2</h4>
            <p>Responsive Bootstrap Box</p>
          </div>
        </div>

        <div class="col-12 col-md-6 mb-3">
          <div class="bg-danger text-white p-5 text-center rounded">
            <h4>Box 3</h4>
            <p>Responsive Bootstrap Box</p>
          </div>
        </div>

        <div class="col-12 col-md-6 mb-3">
          <div class="bg-warning p-5 text-center rounded">
            <h4>Box 4</h4>
            <p>Responsive Bootstrap Box</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
