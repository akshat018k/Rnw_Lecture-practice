<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <style>
      .box {
        color: white;
        text-align: center;
        padding: 20px;
        border: 3px solid white;
        font-size: 24px;
      }

      .c1 {
        background: #29b6f6;
      }
      .c2 {
        background: #00c853;
      }
      .c3 {
        background: #1565c0;
      }
      .c4 {
        background: #7c00ff;
      }
      .c5 {
        background: #d500f9;
      }
      .c6 {
        background: #ff006e;
      }
      .c7 {
        background: #c4002f;
      }
    </style>
  </head>
  <body>
    <div class="container-fluid p-0">
      <!-- 12 x col-1 -->
      <div class="row g-0">
        <div class="col box c1">col 1</div>
        <div class="col box c1">col 1</div>
        <div class="col box c1">col 1</div>
        <div class="col box c1">col 1</div>
        <div class="col box c1">col 1</div>
        <div class="col box c1">col 1</div>
        <div class="col box c1">col 1</div>
        <div class="col box c1">col 1</div>
        <div class="col box c1">col 1</div>
        <div class="col box c1">col 1</div>
        <div class="col box c1">col 1</div>
        <div class="col box c1">col 1</div>
      </div>

      <!-- 4 x col-3 -->
      <div class="row g-0">
        <div class="col-3 box c2">col 3</div>
        <div class="col-3 box c2">col 3</div>
        <div class="col-3 box c2">col 3</div>
        <div class="col-3 box c2">col 3</div>
      </div>

      <!-- 3 x col-4 -->
      <div class="row g-0">
        <div class="col-4 box c3">col 4</div>
        <div class="col-4 box c3">col 4</div>
        <div class="col-4 box c3">col 4</div>
      </div>

      <!-- col-8 + col-4 -->
      <div class="row g-0">
        <div class="col-8 box c4">col 8</div>
        <div class="col-4 box c4">col 4</div>
      </div>

      <!-- col-2 col-2 col-4 col-2 col-2 -->
      <div class="row g-0">
        <div class="col-2 box c5">col 2</div>
        <div class="col-2 box c5">col 2</div>
        <div class="col-4 box c5">col 4</div>
        <div class="col-2 box c5">col 2</div>
        <div class="col-2 box c5">col 2</div>
      </div>

      <!-- col-6 col-6 -->
      <div class="row g-0">
        <div class="col-6 box c6">col 6</div>
        <div class="col-6 box c6">col 6</div>
      </div>

      <!-- col-12 -->
      <div class="row g-0">
        <div class="col-12 box c7">col 12</div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
