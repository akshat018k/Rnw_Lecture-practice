<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>task-3</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <style>
      .section {
        color: white;
        text-align: center;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 24px;
      }

      .header {
        background: #0d1328;
        height: 80px;
      }
      .menu {
        background: #ff4155;
        height: 80px;
      }
      .hero {
        background: #5b8ecb;
        height: 350px;
      }
      .main {
        background: #233552;
        height: 250px;
      }
      .banner {
        background: #f3cf68;
        height: 120px;
        color: black;
      }
      .extra {
        background: #4ec09d;
        height: 120px;
        color: black;
      }
      .image {
        background: #cce7e8;
        height: 120px;
        color: black;
      }
      .empty {
        background: #f4f4f4;
        height: 250px;
      }

      @media (max-width: 767px) {
        .hero {
          height: 180px;
        }
        .main,
        .banner,
        .extra,
        .image {
          height: 120px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container-fluid p-0">
      <!-- Header + Menu -->
      <div class="row g-0">
        <div class="col-12 col-lg-3 order-1">
          <div class="header section">HEADER</div>
        </div>

        <div class="col-12 col-lg-9 order-2">
          <div class="menu section">MENU</div>
        </div>
      </div>

      <!-- Hero -->
      <div class="row g-0">
        <div class="col-12">
          <div class="hero section">HERO</div>
        </div>
      </div>

      <!-- Tablet Layout -->
      <div class="d-none d-md-block d-lg-none">
        <div class="row g-0">
          <div class="col-3">
            <div class="menu section h-100" style="height: 370px !important">
              MENU
            </div>
          </div>

          <div class="col-9">
            <div class="main section">MAIN</div>

            <div class="banner section">BANNER</div>

            <div class="row g-0">
              <div class="col-8">
                <div class="extra section">EXTRA</div>
              </div>

              <div class="col-4">
                <div class="image section">IMAGE</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Desktop Layout -->
      <div class="d-none d-lg-block">
        <div class="row g-0">
          <div class="col-lg-5">
            <div class="main section">MAIN</div>
          </div>

          <div class="col-lg-3">
            <div class="empty"></div>
          </div>

          <div class="col-lg-4">
            <div class="image section">IMAGE</div>

            <div class="extra section">EXTRA</div>
          </div>
        </div>

        <div class="row g-0">
          <div class="col-12">
            <div class="banner section">BANNER</div>
          </div>
        </div>
      </div>

      <!-- Mobile Layout -->
      <div class="d-block d-md-none">
        <div class="main section">MAIN</div>

        <div class="banner section">BANNER</div>

        <div class="extra section">EXTRA</div>

        <div class="image section">IMAGE</div>
      </div>
    </div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
