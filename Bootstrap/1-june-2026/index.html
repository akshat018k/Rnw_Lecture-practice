<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Bootstrap Containers</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <style>
      .box {
        border: 3px solid black;
        padding: 20px;
        margin-bottom: 20px;
      }

      .card{
        height: 400px;
      }
      .card img {
        height: 300px;
        object-fit: cover;
      }


    </style>
  </head>
  <body>
    <!-- Container -->
    <div class="container box ">
      <h2 class="text-center">Our Team</h2>
      <p class="text-center">Meet our professional team members</p>

      <div class="row">
        <div class="col-md-3">
          <div class="card">
            <img src="https://img.magnific.com/free-photo/close-up-portrait-curly-handsome-european-male_176532-8133.jpg?semt=ais_hybrid&w=740&q=80" class="card-img-top" />
            <div class="card-body text-center">
              <h5>John Doe</h5>
              <p>Frontend Developer</p>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRlJLr4QVnDNDY6WIITLMSdmxO-acWeb5wfug&s" class="card-img-top" />
            <div class="card-body text-center">
              <h5>Jane Smith</h5>
              <p>UI Designer</p>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTnQifwhBNTMWlIJ9S5R0N_A6JH4xj-emBJlA&s" class="card-img-top" />
            <div class="card-body text-center">
              <h5>Alex Brown</h5>
              <p>Backend Developer</p>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR0N97I_2AO7Xx6dGuFWc_CozrjdvkWBuu4dQ&s" class="card-img-top" />
            <div class="card-body text-center">
              <h5>Emily Davis</h5>
              <p>Project Manager</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Container Fluid -->
    <div class="container-fluid box">
      <h2 class="text-center">Container Fluid</h2>
      <p class="text-center">Full width container example</p>
    </div>

    <!-- Container SM -->
    <div class="container-sm box">
      <h2 class="text-center">Container SM</h2>
    </div>

    <!-- Container MD -->
    <div class="container-md box">
      <h2 class="text-center">Container MD</h2>
    </div>

    <!-- Container LG -->
    <div class="container-lg box">
      <h2 class="text-center">Container LG</h2>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
