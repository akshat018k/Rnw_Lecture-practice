<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript First Lecture</title>
</head>
<body>

    <h1>Welcome to Second Lecture JavaScript</h1>

    <script>
        "use strict";

        // var example
        var studentName = "Akshat";
        console.log("Student Name:", studentName);

        // let example
        let age = 20;
        console.log("Age:", age);

        // const example
        const course = "JavaScript";
        console.log("Course:", course);

        // Data Types
        let city = "Surat";          // String
        let marks = 95;             // Number
        let isPassed = true;        // Boolean
        let address;                // Undefined
        let value = null;           // Null

        console.log(city);
        console.log(marks);
        console.log(isPassed);
        console.log(address);
        console.log(value);

        // typeof operator
        console.log(typeof city);
        console.log(typeof marks);
        console.log(typeof isPassed);
        console.log(typeof address);
        console.log(typeof value);

        // Array
        let subjects = ["HTML", "CSS", "JavaScript"];
        console.log(subjects);

        // Object
        let student = {
            name: "Akshat",
            age: 20,
            course: "B.Sc IT"
        };

        console.log(student);
    </script>

</body>
</html>
