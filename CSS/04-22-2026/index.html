<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Parallax World</title>
    <link rel="stylesheet" href="./asset/css/style.css">
</head>
<body>

    <!-- Fixed Header -->
    <header class="fixed">
        <h1>Welcome to the Parallax World</h1>
    </header>

    <section class="parallax">
    </section>

    <section class="linear">
        <p>Linear Gradient Section</p>
    </section>

    <section class="radial">
        <p>Radial Gradient Section</p>
    </section>

    <section class="conic">
        <p>Conic Gradient Section</p>
    </section>
    
    <div class="text-block highlight">
        This block uses two classes: text-block and highlight.
    </div>

    <div class="parent">
        <h3>Parent Box Heading</h3>
        <p>This paragraph is a child element styled inside the parent.</p>
    </div>

</body>
</html>
