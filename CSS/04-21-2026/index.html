<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Cards</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <link rel="stylesheet" href="./asset/css/style.css">
</head>
<body>

<!-- Top Card -->
<section class="top">
    <div class="card large">
        <img src="./asset/images/image1.jpg">
    </div>
</section>

<!-- Bottom Cards -->
<section class="bottom">

    <!-- Left Card -->
    <div class="team-box">
        <h2>Meet Our Team</h2>

        <div class="mini-card">
            <img src="./asset/images/image2.jpg">
            <h3>Michael Brown</h3>
            <p>
                <i class="fa-solid fa-code fa-fade"></i> Frontend Developer</p>
        </div>
    </div>

    <!-- Right Card -->
    <div class="profile-card">
        <div class="profile-top">
            <div>
                <h3>Krish R</h3>
                <p>Instructor</p>
            </div>
            <img src="./asset/images/image3.jpg">
        </div>

        <div class="social">
            <i class="fa-brands fa-linkedin"></i>
            <i class="fa-brands fa-twitter"></i>
            <i class="fa-brands fa-facebook"></i>
            <i class="fa-brands fa-instagram"></i>
        </div>

        <p class="desc">
            Subscribe Easy Tutorials YouTube channel to watch more videos on Web design
        </p>
    </div>

</section>

</body>
</html>
