<!DOCTYPE html>
<html lang="en">
    <head>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Css Transform</title>

        <link rel="stylesheet" href="./assets/css/style.css">

    </head>

    <body>
        <div class="container">
            <div class="box"> transform rotate45deg</div>
            <div class="box-2"> transform rotateX 145deg</div>
            <div class="box-3"> transform rotate 1turn</div>
        </div>

        <div class="container">
            <div class="box-4"> transform 45deg</div>
            <div class="box-5"> transform salce</div>
            <div class="box-6"> transform salce x</div>
        </div>

        <div class="container">
            <div class="box-7"> transform skew</div>
            <div class="box-8"> transform skewx</div>
            <div class="box-9"> transform skewy</div>
        </div>

        <div class="container">
            <div class="box-10"> transform matrix([salcex], [skewy], [skewx], [salcey], [translatex], [translatey])</div>
            <div class="box-11"> transform multipale</div>
        </div>


    </body>

</html>
