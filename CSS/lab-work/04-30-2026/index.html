<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi Effect UI</title>
<link rel="stylesheet" href="./asset/css/style.css">


</head>

<body>

<!-- HEADER -->
<div class="header">
    <h1>Multi-Effect UI Showcase</h1>
    <p>All sections styled without Flexbox</p>
</div>

<!-- PROFILE -->
<div class="section">
    <h2>Layered Profile Cards</h2>
    <div class="profile-container">
        
        <div class="profile">
            <img src="https://randomuser.me/api/portraits/women/44.jpg">
            <h3>Alice</h3>
            <p>UI/UX Designer</p>
        </div>

        <div class="profile">
            <img src="https://randomuser.me/api/portraits/men/32.jpg">
            <h3>Bob</h3>
            <p>Full Stack Dev</p>
        </div>

    </div>
</div>

<!-- FLASHCARDS -->
<div class="section">
    <h2>Quiz Flashcards</h2>
    <div class="flashcard">

        <div class="flip-card">
            <div class="flip-inner">
                <div class="flip-front">
                    What is HTML?
                </div>
                <div class="flip-back">
                    HyperText Markup Language
                </div>
            </div>
        </div>
        <div class="flip-card">
            <div class="flip-inner">
                <div class="flip-front">
                    What is Css?
                </div>
                <div class="flip-back">
                    Casecading style Sheets 
                </div>
            </div>
        </div>
    </div>
</div>

<!-- BUTTONS -->
<div class="section">
    <h2>Creative Buttons</h2>
    <button class="btn btn1">Slide Button</button>
    <button class="btn btn2">Glow Button</button>
</div>

<!-- GALLERY -->
<div class="section">
    <h2>Interactive Image Gallery</h2>
    <div class="gallery">

        <div class="img-box">
            <img src="https://picsum.photos/id/1015/400/300">
        </div>
        <div class="img-box">
            <img src="https://picsum.photos/id/1016/400/300">
        </div>

        <div class="img-box">
            <img src="https://picsum.photos/id/1018/400/300">
        </div>
    </div>
</div>

</body>
</html>
