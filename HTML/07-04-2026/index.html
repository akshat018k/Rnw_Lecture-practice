<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job application form</title>
</head>
<body>
    <center>
        <form>
        <table border="2" width="50%" cellpadding="10" cellspacing="5" bgcolor="#f5f5dc">
            <caption><b>Job Application Form</b></caption>
            <tr>
                <td>Full Name:</td>
                <td><input type="text" name="fullname" placeholder="Enter your full name"></td>
            </tr>

            <tr>
                <td>Email Address:</td>
                <td><input type="email" name="email"></td>
            </tr>

            <tr>
                <td>Phone Number:</td>
                <td><input type="tel" name="phone" placeholder="123-489-7852"></td>
            </tr>

            <tr>
                <td>Gender:</td>
                <td>
                    <input type="radio" name="gender" value="male"> Male
                    <input type="radio" name="gender" value="female"> Female
                </td>
            </tr>

            <tr>
                <td>Job Role:</td>
                <td><select>
                        <option>-- Select Role --</option>
                        <option>Web Developer</option>
                        <option>Software Engineer</option>
                        <option>UI/UX Designer</option>
                        <option>Data Analyst</option>
                        <option>Cyber Security Expert</option>
                </select></td>
            </tr>

            <tr>
                <td>Date of Birth:</td>
                <td><input type="date" name="dob"></td>
            </tr>

            <tr>
                <td>Favourite Color:</td>
                <td><input type="color" name="favourite_color"></td>
            </tr>

            <tr>
                <td>Upload Resume:</td>
                <td><input type="file" name="resume"></td>
            </tr>

            <tr>
                <td>Skills:</td>
                <td><input type="checkbox"> HTML
                    <input type="checkbox"> CSS
                    <input type="checkbox"> JavaScript
                    <input type="checkbox"> React
                </td>
            </tr>

            <tr>
                <td>Cover Letter:</td>
                <td><textarea name="cover_letter" placeholder="Write something about yourself..."></textarea></td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Submit">
                    <input type="reset" value="Reset">
                </td>
            </tr>
        </table>
        </form>
    </center>
    
</body>
</html>
