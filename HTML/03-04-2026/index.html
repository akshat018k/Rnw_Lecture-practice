<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>html input/table</title>
    <style>
        table{
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <!-- Input types -->
    <input type="text">
    <input type="button" value="submit">
    <input type="submit">
    <input type="reset">
    <input type="color">
    <input type="date">
    <input type="time">
    <input type="datetime-local">
    <input type="month">
    <input type="week">
    <input type="checkbox">
    <!-- Male/Female -->
    <input type="radio" name="gender">
    <input type="radio" name="gender"> 
    <input type="url">
    <input type="range">
    <input type="hidden">
    <input type="file">
    <input type="email">
    <input type="tel">
    <input type="password">
    <input type="number">
    <input type="search">
    <input type="image">
    <br><br>

    <!-- HTML table -->

    <!-- basic table -->

    <table border="1" >
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Coures</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Aayush</td>
                <td>48</td>
                <td>JavaScript</td>
            </tr>
            <tr>
                <td>Rahul</td>
                <td>25</td>
                <td>Python</td>
            </tr>
            <tr>
                <td>Karan</td>
                <td>21</td>
                <td>Developer</td>
            </tr>
            <tr>
                <td>Dhruv</td>
                <td>27</td>
                <td>JavaScript</td>
            </tr>
        </tbody>
    </table>
    <br><br>

    <!-- HTMl table colgroup -->

    <table border="1">
        <colgroup>
            <col span="1" style="background-color: blue;">
            <col span="1" style="background-color: red;">
        </colgroup>
        <thead>
            <tr>
                <th>Name</th>
                <th>Age</th>
                <th>Coures</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Aayush</td>
                <td>48</td>
                <td>JavaScript</td>
            </tr>
            <tr>
                <td>Rahul</td>
                <td>25</td>
                <td>Python</td>
            </tr>
            <tr>
                <td>Karan</td>
                <td>21</td>
                <td>Developer</td>
            </tr>
            <tr>
                <td>Dhruv</td>
                <td>27</td>
                <td>JavaScript</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
