<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>table2</title>

	<style>
		body {
			font-family: Arial;
		}

		table {
			margin: 20px auto;
			width: 70%;
			background-color: white;
		}

		th, td {
			border: 2px solid black;
			padding: 10px;
			text-align: center;
		}

		th {
			background-color: lightgray;
		}

		.day {
			background-color: gainsboro;
			font-weight: bold;
		}

		.topic {
			background-color: whitesmoke;
		}
	</style>
	</head>

<body>

	<table border="1">
		<thead>
			<tr>
				<th rowspan="3">Day</th>
				<th colspan="3">Seminar</th>
			</tr>

			<tr>
				<th colspan="2">Schedule</th>
				<th rowspan="2">Topic</th>
			</tr>

			<tr>
				<th>Begin</th>
				<th>End</th>
			</tr>
		</thead>

		<tbody>
			<!-- Monday -->
			<tr>
				<td class="day" rowspan="2">Monday</td>
				<td rowspan="2">8:00 a.m.</td>
				<td rowspan="2">5:00 p.m.</td>
				<td class="topic">Introduction to XML</td>
			</tr>
			<tr>
	
				<td class="topic">Validity: DTD and Relax NG</td>
			</tr>

			<!-- Tuesday -->
			<tr>
				<td class="day" rowspan="3">Tuesday</td>
				<td>8:00 a.m.</td>
				<td>11:00 a.m.</td>
				<td class="topic" rowspan="2">XPath</td>
	
			</tr>
			<tr>
				<td>11:00 a.m.</td>
				<td>2:00 p.m.</td>
        	
			</tr>
			<tr>
				<td>2:00 p.m.</td>
				<td>5:00 p.m.</td>
				<td class="topic">XSL Transformations</td>
			</tr>

			<!-- Wednesday -->
			<tr>
				<td class="day">Wednesday</td>
				<td>8:00 a.m.</td>
				<td>12:00 p.m.</td>
				<td class="topic">XSL Formatting Objects</td>
			</tr>
			</tbody>
	</table>

</body>
</html>
